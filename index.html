<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>研究フワフワ大脱出</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3D4BB8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="研究フワフワ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Yomogi&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FCFCF9; --grid:rgba(64,112,196,.085); --grid2:rgba(64,112,196,.17); --margin:rgba(214,64,46,.28);
  --sheet:#FFFFFF; --ink:#1E2A47; --cink:#1E2A47; --pencil:#5C6380; --line:#C7D0E2;
  --red:#D6402E; --marker:#FFE45A; --marker2:#BFEAFF; --tape:rgba(255,212,110,.6);
  --accent:#1E2A47; --accent-soft:#EEF2FA; --heat:#D6402E; --star:#C99512; --focus-bg:#FCFCF9;
  --r-N:#7E879C; --r-R:#2F86C6; --r-SR:#8550D0; --r-SSR:#C2820C; --r-UR:#D1478F;
  --s-hs:#2E9E6B; --s-ug:#2F78C9; --s-gr:#8550D0; --s-ot:#7A8099;
  --hand:"Yomogi","Klee One","Hiragino Maru Gothic ProN",cursive;
  --body:"Klee One","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  --wob1:18px 225px 15px 255px/255px 15px 225px 18px;
  --wob2:255px 15px 225px 15px/15px 225px 15px 255px;
  --wob3:15px 255px 20px 225px/225px 20px 255px 15px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#18202E; --grid:rgba(170,195,255,.055); --grid2:rgba(170,195,255,.11); --margin:rgba(255,123,102,.25);
    --sheet:#202938; --ink:#ECE9E1; --cink:#ECE9E1; --pencil:#A8B0C6; --line:#3A4558;
    --red:#FF7B66; --marker:rgba(255,220,80,.36); --marker2:rgba(120,200,255,.28); --tape:rgba(255,212,110,.22);
    --accent:#ECE9E1; --accent-soft:#283246; --heat:#FF7B66; --star:#F0C75A; --focus-bg:#18202E;
    --r-N:#A3ABBE; --r-R:#6DB6E8; --r-SR:#B48CF0; --r-SSR:#F0BE55; --r-UR:#F07EBE;
    --s-hs:#4CC48C; --s-ug:#6FA5EE; --s-gr:#B48CF0; --s-ot:#A3A9C6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#18202E; --grid:rgba(170,195,255,.055); --grid2:rgba(170,195,255,.11); --margin:rgba(255,123,102,.25);
  --sheet:#202938; --ink:#ECE9E1; --cink:#ECE9E1; --pencil:#A8B0C6; --line:#3A4558;
  --red:#FF7B66; --marker:rgba(255,220,80,.36); --marker2:rgba(120,200,255,.28); --tape:rgba(255,212,110,.22);
  --accent:#ECE9E1; --accent-soft:#283246; --heat:#FF7B66; --star:#F0C75A; --focus-bg:#18202E;
  --r-N:#A3ABBE; --r-R:#6DB6E8; --r-SR:#B48CF0; --r-SSR:#F0BE55; --r-UR:#F07EBE;
  --s-hs:#4CC48C; --s-ug:#6FA5EE; --s-gr:#B48CF0; --s-ot:#A3A9C6;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;color:var(--ink);font-family:var(--body);font-weight:600;font-size:16px;line-height:1.7;-webkit-tap-highlight-color:transparent;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:80px 80px,80px 80px,16px 16px,16px 16px;background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px dashed var(--red);outline-offset:3px}
img,svg{max-width:100%}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}
#app::before{content:"";position:fixed;top:0;bottom:0;left:max(10px,calc(50% - 230px));width:0;border-left:2px solid var(--margin);pointer-events:none}
main{flex:1;padding:16px 18px 112px 26px}
body.nonav main{padding-bottom:32px}
.screen{display:flex;flex-direction:column;gap:18px;min-height:100%}

/* 紙・テープ・蛍光ペン */
.paper{background:var(--sheet);border:2px solid var(--ink);border-radius:var(--wob1);box-shadow:2px 3px 0 color-mix(in srgb,var(--ink) 14%,transparent);position:relative}
.tape::before{content:"";position:absolute;top:-11px;left:50%;width:76px;height:22px;transform:translateX(-50%) rotate(-3deg);background:var(--tape);border-left:1px dashed rgba(0,0,0,.08);border-right:1px dashed rgba(0,0,0,.08)}
.hl{background:linear-gradient(100deg,transparent 0 1%,var(--marker) 2% 97%,transparent 99%) 0 72%/100% 46% no-repeat;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .12em}

/* ボタン */
.btn{border:2px solid var(--ink);background:var(--sheet);border-radius:var(--wob2);min-height:52px;padding:10px 18px;font-weight:600;font-size:17px;transition:transform .07s ease,box-shadow .07s}
.btn:active{transform:translate(2px,3px)}
.btn-primary{width:100%;min-height:70px;font-family:var(--hand);font-weight:400;font-size:26px;letter-spacing:.06em;background:var(--marker);border:2.5px solid var(--ink);border-radius:var(--wob1);box-shadow:3px 4px 0 var(--ink);transform:rotate(-.6deg)}
.btn-primary:active{transform:rotate(-.6deg) translate(3px,4px);box-shadow:0 0 0 var(--ink)}
.btn-primary:disabled{opacity:.45;cursor:default;transform:rotate(-.6deg);box-shadow:none}
.btn-soft{width:100%;box-shadow:2px 3px 0 color-mix(in srgb,var(--ink) 25%,transparent)}
.btn-quiet{background:transparent;border:0;color:var(--pencil);font-weight:600;font-size:15px;min-height:46px;padding:8px 12px;text-decoration:underline wavy;text-decoration-color:color-mix(in srgb,var(--pencil) 60%,transparent);text-underline-offset:5px}
.btn-small{min-height:40px;font-size:14px;padding:4px 14px;border:2px solid var(--ink);border-radius:var(--wob3);background:var(--sheet);font-weight:600}

/* 入力 */
.ob h1{font-family:var(--hand);font-weight:400;font-size:32px;line-height:1.35;margin:10px 0 4px}
.lead{margin:0;color:var(--pencil);font-size:15px}
.field{display:flex;flex-direction:column;gap:8px}
.field label,.field .lbl{font-weight:600;font-size:16px}
.field input,textarea,select{font:inherit;font-size:16px;padding:12px 14px;border-radius:var(--wob3);border:2px solid var(--ink);background:var(--sheet);color:var(--ink)}
.field input:focus,textarea:focus,select:focus{outline:none;box-shadow:0 0 0 4px var(--marker)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--ink);background:var(--sheet);border-radius:var(--wob3);padding:6px 14px;min-height:44px;font-size:15px;font-weight:600;transition:transform .07s}
.chip:nth-child(2n){border-radius:var(--wob2)}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--marker2);box-shadow:2px 2px 0 var(--ink)}
.note{font-size:14px;color:var(--pencil);background:var(--sheet);border:2px dashed var(--line);border-radius:var(--wob2);padding:12px 14px;font-weight:600}

/* ホーム */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px}
.hello{font-family:var(--hand);font-size:18px}
.pill{display:flex;align-items:center;gap:6px;background:var(--sheet);border:2px solid var(--ink);border-radius:var(--wob3);padding:4px 12px;font-size:14px;min-height:40px;font-weight:600}
.pill b{font-variant-numeric:tabular-nums}
.pill.ready{background:var(--marker);transform:rotate(1.5deg)}
.guardian{display:flex;flex-direction:column;align-items:center;gap:0;background:none;border:0;padding:0;margin:0 auto}
.guardian .art{width:158px;height:158px;animation:bob 4.5s ease-in-out infinite}
.guardian.hop .art{animation:hop .45s cubic-bezier(.3,1.6,.5,1)}
.guardian .line{font-family:var(--hand);font-size:18px;color:var(--ink);min-height:1.6em;position:relative;padding:0 6px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-5px) rotate(1deg)}}
@keyframes hop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-18px) scale(1.06,.94) rotate(-4deg)}100%{transform:translateY(0) scale(1)}}
.desk{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 8px;margin:-10px auto 0;padding:0 10px 2px;border-bottom:2.5px solid var(--ink);border-radius:0 0 40% 50%/0 0 6px 4px;max-width:90%}
.tool{width:30px;height:30px;color:var(--ink);display:inline-block}
.tool svg{width:100%;height:100%;display:block}
.step{padding:20px 20px 22px;transform:rotate(.4deg)}
.step .k{font-size:14px;font-weight:600;color:var(--red);display:flex;justify-content:space-between;gap:8px;margin-bottom:2px}
.step .k span:last-child{color:var(--pencil)}
.step .t{font-family:var(--hand);font-size:clamp(24px,6.9vw,31px);line-height:1.5;margin:0;word-break:auto-phrase;text-wrap:pretty}
.home-actions{display:flex;flex-direction:column;align-items:center;gap:2px}
.tools{margin-top:12px;border-top:1.5px dashed var(--line);padding-top:10px}
.tools .tl{font-size:13px;color:var(--pencil);display:block;margin-bottom:8px}
.tlrow{display:flex;flex-wrap:wrap;gap:8px}
.tbtn{flex:1 1 28%;min-width:92px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;text-decoration:none;color:var(--ink);background:var(--sheet);border:2px solid var(--ink);border-radius:var(--wob3);padding:4px 6px;box-shadow:2px 2px 0 var(--ink);line-height:1.3;transition:transform .07s,box-shadow .07s}
.tbtn:nth-child(2){border-radius:var(--wob2)}
.tbtn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.tbtn b{font-size:14px}
.tbtn small{font-size:11px;color:var(--pencil);font-weight:600}

/* 活性化エネルギーのゲージ */
.gauge{padding:10px 14px 8px;display:block;width:100%;text-align:left;font:inherit;color:inherit;border-radius:var(--wob2)}
.gauge svg{width:100%;height:auto;display:block;overflow:visible}
.gauge .g-curve{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round}
.gauge .g-fill{fill:none;stroke:var(--marker);stroke-width:13;stroke-linecap:round;opacity:.95}
.gauge .g-dot{fill:var(--red);stroke:var(--ink);stroke-width:2}
.gauge .g-cap{display:flex;justify-content:space-between;font-size:14px;color:var(--pencil);gap:8px}
.gauge .g-cap b{color:var(--ink);font-family:var(--hand);font-weight:400;font-size:19px}

/* 研究中・終了 */
.focus{justify-content:center;align-items:center;text-align:center;min-height:calc(100vh - 80px);gap:28px}
.focus .mode{font-size:12px;letter-spacing:.3em;color:var(--pencil);opacity:.8}
.focus .clock{font-family:var(--body);font-size:clamp(58px,20vw,90px);font-weight:400;font-variant-numeric:tabular-nums;line-height:1}
.focus .end{background:transparent;border:2px solid var(--ink);color:var(--pencil);border-radius:var(--wob2);min-height:52px;padding:8px 26px;font-weight:600}
.endscr{justify-content:center;min-height:calc(100vh - 80px);text-align:center;gap:22px}
.endscr h2{font-family:var(--hand);font-weight:400;font-size:32px;margin:0}
.endscr .q{font-size:19px;font-weight:600;margin:0}
.endscr .dur{color:var(--pencil);margin:0}
.pair{display:grid;gap:14px}

/* 問いの型・くらべっこ */
.stems{margin-top:12px;border-top:1.5px dashed var(--line);padding-top:10px}
.stems .tl{font-size:13px;color:var(--pencil);display:block;margin-bottom:8px}
.stemrow{display:flex;flex-wrap:wrap;gap:6px}
.stem{border:2px solid var(--ink);background:var(--sheet);border-radius:var(--wob3);padding:4px 10px;min-height:40px;font-size:14px;font-weight:600;text-align:left}
.stem:nth-child(2n){border-radius:var(--wob2)}
.stem[aria-pressed="true"]{background:var(--marker2)}
.stemex{margin:10px 0 0;font-family:var(--hand);font-size:17px;line-height:1.55;min-height:2.4em}
.qlink{padding-left:0;margin-top:2px}
.qcard{padding:16px 16px 14px;display:flex;flex-direction:column;gap:8px;transform:rotate(-.3deg)}
.quiz{gap:12px}
.qscene{margin:0;font-family:var(--hand);font-size:21px;line-height:1.5}
.qopts{display:flex;flex-direction:column;gap:10px}
.qopt{text-align:left;border:2px solid var(--ink);background:var(--sheet);border-radius:var(--wob2);padding:10px 14px;min-height:54px;font-family:var(--hand);font-size:18px;line-height:1.45;box-shadow:2px 3px 0 var(--ink);transition:transform .07s}
.qopt:nth-child(2){border-radius:var(--wob3)}
.qopt:active{transform:translate(2px,3px);box-shadow:none}
.qopt:disabled{box-shadow:none;cursor:default}
.qopt.lv3{background:var(--marker)}
.qopt.lv1,.qopt.lv2{color:var(--pencil)}
.qopt.chosen{outline:3px solid var(--red);outline-offset:2px}
.qtag{display:block;font-family:var(--body);font-size:12px;font-weight:600;color:var(--red)}
.qopt.lv3 .qtag{color:var(--ink)}
.qwhy{display:block;font-family:var(--body);font-size:13px;font-weight:600;color:var(--pencil);margin-top:4px}
.qopt.lv3 .qwhy{color:var(--ink)}
.qres{margin:0;font-family:var(--hand);font-size:20px}

/* 下書きメモ */
.memo-btn{background:var(--sheet);border:2px dashed var(--ink);border-radius:var(--wob3);min-height:48px;padding:6px 20px;color:var(--ink);font-weight:600;font-size:15px}
.mlist{display:flex;flex-direction:column;width:100%;text-align:left}
.mitem{border-bottom:1.5px dashed var(--line);padding:8px 0 10px;display:grid;grid-template-columns:50px 1fr;gap:6px}
.mtime{color:var(--red);font-size:14px;font-variant-numeric:tabular-nums;padding-top:3px}
.mtext{font-family:var(--hand);font-size:18px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.mold{text-decoration:line-through;color:var(--pencil);font-size:15px;white-space:pre-wrap;word-break:break-word}
.medit-at{font-family:var(--body);font-size:12px;color:var(--pencil)}
.mphoto{max-width:100%;max-height:230px;border:2px solid var(--ink);border-radius:3px;transform:rotate(-1deg);display:block;margin:4px 0 6px;background:var(--paper)}
.mact{display:flex;gap:2px;flex-wrap:wrap}
.mact button{background:none;border:0;color:var(--pencil);font-size:13px;text-decoration:underline;min-height:36px;padding:2px 6px 2px 0}
.mvoid .mtext{text-decoration:line-through;color:var(--pencil)}
.mvoid .mphoto{opacity:.4}
.mcompose{display:flex;flex-direction:column;gap:8px;width:100%}
.mcompose textarea{min-height:72px;font-family:var(--hand);font-size:18px;width:100%}
.mrow{display:flex;gap:8px}
.mrow .btn{flex:1;min-height:48px}
.endmemos{max-height:40vh;overflow:auto;text-align:left;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.mdays{display:flex;flex-direction:column;gap:8px}
.mday{width:100%;display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:54px;text-align:left;font:inherit;color:inherit}

/* 見出し */
h2.ttl{font-family:var(--hand);font-weight:400;font-size:30px;margin:2px 0 0;line-height:1.3}
h2.ttl.sm{font-size:24px}
.count{color:var(--pencil);margin:0;font-size:15px}

/* 探究マップ */
.phase{display:flex;flex-direction:column;gap:10px}
.phase h3{margin:8px 0 0;font-size:15px;color:var(--red);font-weight:600}
.node{background:var(--sheet);border:2px solid var(--ink);border-radius:var(--wob3);overflow:hidden}
.node:nth-child(odd){border-radius:var(--wob2)}
.node.here{box-shadow:3px 3px 0 var(--ink)}
.node>button{width:100%;background:none;border:0;display:flex;align-items:center;gap:12px;padding:10px 14px;text-align:left;min-height:56px}
.node .dotc{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--hand);font-size:18px;border:2px solid var(--ink)}
.node.here .dotc{border-color:var(--red);color:var(--red);box-shadow:0 0 0 3px var(--sheet),0 0 0 5px var(--red)}
.node .nm{flex:1;font-weight:600}
.node .fp{font-size:13px;color:var(--pencil);white-space:nowrap}
.node .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:2px}
.mstep{background:none;border:0;border-bottom:1.5px dashed var(--line);padding:10px 2px;text-align:left;font-family:var(--hand);font-size:18px;min-height:46px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.mstep small{color:var(--red);font-family:var(--body);font-size:13px;white-space:nowrap}
.node .body .btn-soft{margin-top:8px}
.loop{text-align:center;color:var(--pencil);font-size:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--sheet);border:2px solid var(--ink);border-radius:var(--wob3);padding:12px 14px}
.stat:nth-child(2n){border-radius:var(--wob2)}
.stat .v{font-family:var(--hand);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .v small{font-family:var(--body);font-size:14px;color:var(--pencil)}
.stat .l{font-size:13px;color:var(--pencil);margin-top:4px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rcard{padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--pencil);border-radius:var(--wob2)}
.rcard b{color:var(--ink);font-size:14px}
.rcard .rmark{width:46px;height:28px}
.rcard.locked{background:transparent;border:2px dashed var(--line);box-shadow:none;justify-content:center;align-items:center;min-height:96px;text-align:center}
.settings{display:flex;flex-direction:column;gap:8px}
.testbox{display:flex;flex-direction:column;gap:8px}
.code{font-family:var(--hand);font-size:26px;letter-spacing:.12em;color:var(--ink)}
.exportbox{width:100%;min-height:150px;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;line-height:1.5;font-weight:400}

/* 広場 */
.composer{padding:14px;display:flex;flex-direction:column;gap:10px}
.composer textarea{width:100%;min-height:84px;resize:vertical;font-family:var(--hand);font-size:18px}
.crow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.crow .cc{font-size:13px;color:var(--pencil);font-variant-numeric:tabular-nums}
.filters{display:flex;flex-direction:column;gap:8px}
.filters .row{display:flex;gap:8px}
.filters input,.filters select{flex:1;min-width:0;padding:8px 12px;font-size:15px}
.post{background:var(--sheet);border:2px solid var(--ink);border-radius:var(--wob1);padding:14px;display:flex;flex-direction:column;gap:8px;position:relative}
.post:nth-child(even){border-radius:var(--wob2);transform:rotate(-.4deg)}
.post header{display:flex;gap:10px;align-items:center}
.pava{width:44px;height:44px;flex:none;border-radius:50%;border:2px solid var(--ink);background:var(--paper);display:grid;place-items:center;overflow:hidden}
.pava .art{width:40px;height:40px}
.who{flex:1;min-width:0}
.who b{font-size:15px}
.meta{font-size:12px;color:var(--pencil)}
.sb{display:inline-block;font-size:11px;font-weight:600;color:var(--sb);border:1.5px solid var(--sb);border-radius:4px;padding:0 6px;margin-left:4px;vertical-align:2px}
.cat{font-size:12px;font-weight:600;color:var(--red)}
.ptext{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--hand);font-size:18px;line-height:1.6}
.reacts{display:flex;flex-wrap:wrap;gap:6px}
.rbtn{border:2px solid var(--ink);background:var(--sheet);border-radius:var(--wob3);padding:2px 12px;min-height:38px;font-size:14px;font-weight:600;transition:transform .07s}
.rbtn:active{transform:scale(.92)}
.rbtn[aria-pressed="true"]{background:var(--marker)}
.rbtn.pop{animation:pop .3s ease}
@keyframes pop{50%{transform:scale(1.18) rotate(-4deg)}}
.replies{display:flex;flex-direction:column;gap:6px;border-top:1.5px dashed var(--line);padding-top:8px}
.reply{font-size:14px;display:flex;gap:8px;align-items:flex-start}
.reply .rt{flex:1;min-width:0;word-break:break-word}
.reply.stepr .rt{font-family:var(--hand);font-size:17px}
.reply .tag{font-family:var(--body);font-size:11px;font-weight:600;color:var(--red);display:block}
.icon-btn{background:none;border:0;color:var(--pencil);font-size:13px;min-height:36px;padding:4px 8px}
.empty{text-align:center;color:var(--pencil);padding:24px 8px;font-family:var(--hand);font-size:18px}

/* 観測ノート */
.obs-page{padding:22px 10px;display:flex;justify-content:center;border-radius:var(--wob2)}
.lens{position:relative;width:min(270px,76vw);aspect-ratio:1;border-radius:50%;border:3px solid var(--ink);background:var(--paper);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 8px var(--sheet),inset 0 0 0 10px var(--line)}
.lens .cross{position:absolute;inset:0;width:100%;height:100%;color:var(--pencil)}
.lens[data-phase="scan"] .cross{animation:spin 1.6s linear infinite}
.creature{position:relative;width:64%;aspect-ratio:1}
.creature>div{position:absolute;inset:0;opacity:0;transition:opacity .35s}
.creature .halo{inset:-24%}
.creature .halo svg,.creature .sk svg,.creature .paint svg{width:100%;height:100%}
.lens[data-phase="sil"] .sk,.lens[data-phase="glow"] .sk{opacity:1}
.lens[data-phase="glow"] .halo,.lens[data-phase="reveal"] .halo{opacity:1}
.creature .paint{clip-path:circle(0% at 35% 65%);transition:clip-path .85s cubic-bezier(.5,0,.3,1),opacity .15s}
.lens[data-phase="reveal"] .paint{opacity:1;clip-path:circle(90% at 35% 65%)}
.lens[data-phase="reveal"] .sk{opacity:0;transition-delay:.5s}
.idle-msg{position:absolute;text-align:center;font-family:var(--hand);font-size:17px;color:var(--pencil);padding:0 30px;margin:0}
@keyframes spin{to{transform:rotate(360deg)}}
.obs-panel{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.obs-panel .result-name{font-family:var(--hand);font-size:30px;margin:0;line-height:1.3}
.obs-panel .sub{color:var(--pencil);margin:0;font-size:15px}
.badge{display:inline-block;font-family:var(--body);font-size:12px;font-weight:600;padding:0 8px;border-radius:3px;color:var(--rb,var(--r-N));border:2px solid var(--rb,var(--r-N));letter-spacing:.08em;transform:rotate(-5deg);background:var(--sheet)}
details.rates{background:var(--sheet);border:2px dashed var(--line);border-radius:var(--wob3);padding:2px 14px;font-size:14px}
details.rates summary{min-height:44px;display:flex;align-items:center;color:var(--pencil);cursor:pointer}
.rates table{width:100%;border-collapse:collapse;margin:4px 0 8px}
.rates td{padding:5px 0;border-top:1px dashed var(--line)}
.rates td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.drawin{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .5s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* 図鑑 */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px}
.cell{background:var(--sheet);border:2px solid var(--ink);border-radius:var(--wob3);padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-height:150px;position:relative}
.cell:nth-child(3n+2){border-radius:var(--wob2);transform:rotate(.8deg)}
.cell:nth-child(3n){transform:rotate(-.6deg)}
.cell .art{width:82px;height:82px}
.cell .nm{font-size:12px;font-weight:600;line-height:1.35;word-break:break-word}
.cell.unknown{background:transparent;border-style:dashed;border-color:var(--line)}
.cell.unknown .nm{color:var(--pencil);letter-spacing:.1em}
.cell.current::after{content:"";position:absolute;inset:-6px;border:2.5px solid var(--red);border-radius:50% 45% 55% 48%/48% 55% 45% 52%;pointer-events:none;transform:rotate(-3deg)}

/* シート */
.sheet-bg{position:fixed;inset:0;background:rgba(20,24,40,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background-color:var(--sheet);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:16px 16px;border:2px solid var(--ink);border-bottom:0;width:100%;max-width:480px;border-radius:24px 30px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;max-height:92vh;overflow:auto}
.sheet .art{width:170px;height:170px}
.sheet h3{margin:0;font-family:var(--hand);font-weight:400;font-size:28px}
.sheet.form{align-items:stretch;text-align:left}
.memo{list-style:none;margin:4px 0 0;padding:0;width:100%;text-align:left}
.memo li{font-family:var(--hand);font-size:17px;line-height:1.55;border-bottom:1.5px dashed var(--line);padding:7px 2px 5px}
.memo li.locked{color:var(--pencil);font-family:var(--body);font-size:14px}

/* 反応演出 */
.react-ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;cursor:pointer;background:rgba(20,24,40,.5);animation:fadeIn .2s both}
.rpage{width:min(100%,420px);padding:16px 14px 18px;text-align:center;transform:rotate(-1deg);animation:slideIn .35s cubic-bezier(.2,.9,.3,1.2) both;
  background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:80px 80px,80px 80px,16px 16px,16px 16px}
.rpage svg{width:100%;height:auto;overflow:visible}
.rpage .big{font-family:var(--hand);font-size:clamp(32px,9vw,40px);margin:0;opacity:0;animation:fadeIn .4s 1.5s forwards}
.rpage .small{font-size:16px;margin:0;opacity:0;animation:fadeIn .4s 1.8s forwards}
.rpage .small2{font-size:13px;color:var(--pencil);margin:4px 0 0;opacity:0;animation:fadeIn .4s 2.1s forwards}
.rpage .skip{display:block;font-size:12px;color:var(--pencil);margin-top:6px}
@keyframes slideIn{from{transform:translateY(40px) rotate(-4deg);opacity:0}to{transform:rotate(-1deg);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ナビ */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:2.5px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}

#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-8px) rotate(-1deg);background:var(--marker);color:var(--ink);border:2px solid var(--ink);padding:8px 18px;border-radius:var(--wob3);font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:60;max-width:calc(100% - 32px);text-align:center;box-shadow:2px 3px 0 var(--ink)}

/* ===== パソコン・タブレットの横長画面 ===== */
.ob,.endscr,.focus{width:100%}

  .sheet-bg{align-items:center;padding:24px}

}
@media (prefers-reduced-motion:reduce){

<script>
(function(){
"use strict";
/* ===== テスト担当者が書き換える設定（ここだけ）===================
   Google Apps Script で作った「ウェブアプリのURL」と「合言葉」を入れると、
   「テスト結果を送る」からスプレッドシートに直接届くようになります。
   空のままなら、これまでどおりコピーや共有で送る形になります。 */
const RESULT_ENDPOINT='https://script.google.com/macros/s/AKfycbxO9smZK5_n9AJHxCphcYcGvXlxGdMOFA4t8EcsKgSI6X1PyVX-BRMcJC8a8hBGfCXP/exec';
const RESULT_TOKEN='fuwa-2026-chem';
/* ============================================================ */

/* ===== キャラクター ===== */
const CHARS = [
  {id:'magma',name:'マグマ漏れ太郎',r:'N',p:24},{id:'fuwa',name:'仮説フワフワン',r:'N',p:22},
  {id:'hori',name:'データホリホリ獣',r:'R',p:16},{id:'tsun',name:'文献ツンツン竜',r:'R',p:14},
  {id:'gunya',name:'グラフグニャグニャ',r:'R',p:10},{id:'bayes',name:'ベイズドラゴン',r:'SR',p:5},
  {id:'meteo',name:'隕石サウルス',r:'SR',p:4},{id:'ida',name:'イーダ始祖鳥',r:'SR',p:2.5},
  {id:'rex',name:'Impactus Rex',r:'SSR',p:1.2},{id:'cosmo',name:'CosmoNova',r:'SSR',p:0.9},
  {id:'prism',name:'Anomalo Prism',r:'SSR',p:0.3},{id:'noir',name:'Archaeopteryx Noir',r:'UR',p:0.09},
  {id:'galaxy',name:'Galaxy Genesis',r:'UR',p:0.01}
];
const BYID = Object.fromEntries(CHARS.map(c=>[c.id,c]));
const STARTER='magma', OBS_COST=8;

/* ===== 基本設定 ===== */
const MIN_COUNT_SEC=60, MIN_REWARD_SEC=180, DAILY_REWARD_CAP=3, MAX_SESSION_SEC=3*3600;
const LOGIN_MILESTONE_EVERY=7, LOGIN_NORMAL=1, LOGIN_MILESTONE=3;
const PITY_STEP=0.25, PITY_MAX=3;
const POST_MAX=140, STEP_MAX=25, REPLY_MAX=100, POST_INTERVAL_MS=30000;

const STAGES=[
  {id:'hs',label:'高校生（探究）',short:'高校生'},
  {id:'ug',label:'大学生（卒業研究）',short:'大学生'},
  {id:'gr',label:'大学院生（修士・博士）',short:'大学院生'},
  {id:'ot',label:'その他',short:'その他'}
];
const SBY=Object.fromEntries(STAGES.map(s=>[s.id,s]));
const FIELDS=['地学・宇宙','物理・化学','生物・医療','情報・数理','環境・農','人文・歴史','社会・経済','教育・心理','まだ決めていない'];

/* ② 達成：探究の過程（藤枝2021の学習過程）をスモールステップに分解 */
const PROCESS=[
  {id:'notice', phase:'課題の把握', name:'気付き', steps:['気になることを3つメモしよう','身の回りの「なぜ？」を1つメモしよう','気になるニュースを1つ読もう','教科書の図を1つ眺めよう','5分だけ観察してみよう']},
  {id:'question', phase:'課題の把握', name:'課題の設定', steps:['「なぜ」を調べられる形に直そう','問いの型を1つ使ってみよう','問いを1行で書いてみよう','キーワードを1つ検索しよう','先行研究を1本だけ探そう','先行研究を1ページだけ読もう']},
  {id:'hypo', phase:'課題の探究', name:'仮説の設定', steps:['「〜を変えると」で予想を書こう','予想を1つだけ書いてみよう','予想の理由を1行書こう','「もし〜なら」を1つ書こう','論文の要旨だけ読もう']},
  {id:'plan', phase:'課題の探究', name:'検証計画の立案', steps:['測るものを1つ決めよう','必要な道具を1つ書き出そう','手順の最初の1行を書こう','先生に聞きたいことを1つ書こう']},
  {id:'run', phase:'課題の探究', name:'観察・実験・調査', steps:['研究ノートを開いてみよう','測定を1回だけやってみよう','データのファイルを開こう','コードを1回だけ動かそう']},
  {id:'result', phase:'課題の探究', name:'結果の処理', steps:['表を1つだけ作ろう','グラフを1つだけ描こう','外れ値を1つ確かめよう','図を1つだけ見直そう']},
  {id:'discuss', phase:'課題の解決', name:'考察・推論', steps:['結果を1文で言ってみよう','予想と結果を比べよう','先行研究と1点だけ比べよう','「なぜそうなった？」を1つ書こう']},
  {id:'express', phase:'課題の解決', name:'表現・伝達', steps:['スライドを1枚だけ作ろう','要旨の1文目を書こう','誰かに1分で話してみよう','原稿の1段落を読み返そう']}
];
const PBY=Object.fromEntries(PROCESS.map(p=>[p.id,p]));
const DEFAULT_PROC='question';
const RETURN_STEP='今日は5分だけ戻ってみよう';
const LINES=['今日はこれだけでいい。','一歩だけ、見てみよう。','5分でも、戻れたら十分。','完璧じゃなくて大丈夫。','開くだけでも、一歩だよ。'];
const TAP_LINES=['ふわっ。','押してくれてありがとう。','一緒に一歩だけ。','次の反応、楽しみだね。','研究ノート、開いてみる？','ちょっとだけ、ね。'];

/* ⑤ 成長：活性化エネルギーを越えると化学反応が起きる */
const REACTIONS=[
  {type:'flame',  color:'#E8394A', label:'炎色反応：リチウム（赤）', fact:'炎に入れると濃い赤に。電池にも使われる軽い金属。'},
  {type:'explode',color:'#FFC94A', label:'爆発：水素と酸素', fact:'水素と酸素が反応して水ができる。ポンと音がする。'},
  {type:'flame',  color:'#F2B705', label:'炎色反応：ナトリウム（黄）', fact:'みそ汁がふきこぼれると火が黄色くなるのはこれ。'},
  {type:'volcano',color:'#F2652E', label:'火山噴火', fact:'たまったマグマの圧力が限界を越えると噴き出す。'},
  {type:'flame',  color:'#A35BD9', label:'炎色反応：カリウム（赤紫）', fact:'淡い赤紫。ナトリウムの黄色に隠れやすい。'},
  {type:'flame',  color:'#1FB59A', label:'炎色反応：銅（青緑）', fact:'青緑の炎。花火の緑や青に使われる。'},
  {type:'explode',color:'#FF9A3C', label:'爆発：テルミット反応', fact:'アルミニウムが酸化鉄から酸素をうばい、鉄が溶け出す。'},
  {type:'flame',  color:'#D21F3C', label:'炎色反応：ストロンチウム（深紅）', fact:'深い紅色。赤い花火の主役。'},
  {type:'flame',  color:'#8CC63F', label:'炎色反応：バリウム（黄緑）', fact:'黄緑色の炎。緑の花火に使われる。'},
  {type:'flame',  color:'#F07A2A', label:'炎色反応：カルシウム（橙赤）', fact:'橙赤色の炎。石灰や貝がらに含まれる元素。'}
];
const reactionFor=lv=>REACTIONS[(lv-2+REACTIONS.length*100)%REACTIONS.length];
const eaFor=lv=>4+2*lv;   // Lv→Lv+1 に必要な活性化エネルギー

/* ===== 落書き化エンジン：もとの図形から「ペンの輪郭・色鉛筆のぬり・細い線・目や口」を作る ===== */
const SVGNS='http://www.w3.org/2000/svg';
const DOODLE={};
const isWhiteF=f=>/^#(fff|ffffff)$/i.test(f||'');
function effFill(el){ let n=el; while(n&&n.getAttribute){ const f=n.getAttribute('fill'); if(f!=null) return f; n=n.parentNode; } return '#000'; }
function kindOf(el){
  const tag=el.tagName.toLowerCase();
  if(tag==='text') return 'text';
  const f=effFill(el), st=el.getAttribute('stroke'), sw=parseFloat(el.getAttribute('stroke-width')||'1');
  if((f==='none'||!f)&&st) return sw>=8?'thick':'stroke';
  if(/^#1d1b2b$/i.test(f)) return 'pupil';
  if(isWhiteF(f)&&tag==='circle'&&parseFloat(el.getAttribute('r')||'9')<=1.6) return 'hi';
  if(/^#ff8fa3$/i.test(f)) return 'blush';
  return 'body';
}
function layer(root,mode){
  const c=root.cloneNode(true);
  [...c.querySelectorAll('path,circle,ellipse,rect,polygon,text')].forEach(el=>{
    const k=kindOf(el), sw=parseFloat(el.getAttribute('stroke-width')||'1');
    const drop=()=>el.remove();
    if(mode==='sil'){
      if(k==='body'){ el.setAttribute('stroke-width','5'); el.setAttribute('stroke-linejoin','round'); el.removeAttribute('opacity'); el.style.fill='var(--sheet)'; el.style.stroke='var(--cink)'; }
      else if(k==='thick'){ el.setAttribute('stroke-width',String(sw+5)); el.style.stroke='var(--cink)'; el.removeAttribute('stroke-dasharray'); }
      else drop();
    }else if(mode==='fill'){
      if(k==='body'||k==='blush'){ el.removeAttribute('stroke'); }
      else if(k!=='thick') drop();
    }else if(mode==='line'){
      if(k==='body'){ el.setAttribute('fill','none'); el.style.fill='none'; el.style.stroke='var(--cink)'; el.setAttribute('stroke-width','1.3'); el.setAttribute('stroke-linejoin','round'); }
      else drop();
    }else if(mode==='det'){
      if(k==='body'||k==='thick'||k==='blush') drop();
    }else if(mode==='sketch'){
      if(k==='body'||k==='thick'){ el.setAttribute('fill','none'); el.style.fill='none'; el.style.stroke='var(--cink)'; el.setAttribute('stroke-width',k==='thick'?'2':'1.6'); el.setAttribute('stroke-dasharray','5 4'); el.setAttribute('stroke-linecap','round'); }
      else drop();
    }
  });
  c.querySelectorAll('defs').forEach(d=>d.remove());
  return c.innerHTML;
}
function doodleParts(id){
  if(DOODLE[id]) return DOODLE[id];
  const root=document.createElementNS(SVGNS,'svg'); root.innerHTML=artBody(id);
  const defs=[...root.querySelectorAll('defs')].map(d=>d.outerHTML).join('');
  const p={defs,sil:layer(root,'sil'),fill:layer(root,'fill'),line:layer(root,'line'),det:layer(root,'det'),sketch:layer(root,'sketch')};
  return (DOODLE[id]=p);
}
function art(id,cls=''){
  const d=doodleParts(id), mini=cls.includes('mini');
  if(cls.includes('sil')) return `<svg class="art ${cls}" viewBox="-8 -8 136 136" role="img" aria-label="まだ描かれていない生命体"><g ${mini?'':'filter="url(#wob1)"'} opacity=".55">${d.sketch}</g></svg>`;
  return `<svg class="art ${cls}" viewBox="-8 -8 136 136" role="img" aria-label="${esc(BYID[id].name)}">${d.defs}`+
    `<g class="lay-sil" ${mini?'':'filter="url(#wob1)"'}>${d.sil}</g>`+
    `<g class="lay-fill" transform="translate(1.6 1.3)" ${mini?'':'filter="url(#pencil)"'}>${d.fill}</g>`+
    `<g class="lay-line" ${mini?'':'filter="url(#wob1)"'} opacity=".5">${d.line}</g>`+
    `<g class="lay-det">${d.det}</g></svg>`;
}

/* ===== 効果音（WebAudioで合成。初期設定は音なし）と振動 ===== */
const SFX={ctx:null,
  on(){ return !!(S.settings&&S.settings.sound); },
  c(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } if(this.ctx.state==='suspended') this.ctx.resume(); return this.ctx; },
  tone(f,dur,o={}){ const c=this.c(); if(!c) return; const t=c.currentTime+(o.at||0), os=c.createOscillator(), g=c.createGain();
    os.type=o.type||'sine'; os.frequency.setValueAtTime(f,t); if(o.to) os.frequency.exponentialRampToValueAtTime(o.to,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(o.vol||0.1,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    os.connect(g).connect(c.destination); os.start(t); os.stop(t+dur+0.03); },
  noise(dur,o={}){ const c=this.c(); if(!c) return; const t=c.currentTime+(o.at||0), n=Math.floor(c.sampleRate*dur), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(o.grain?((i>>9)%3?0.35:1):1);
    const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain(); s.buffer=b; f.type=o.lp?'lowpass':'highpass'; f.frequency.value=o.freq||2400;
    g.gain.setValueAtTime(o.vol||0.05,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); s.connect(f).connect(g).connect(c.destination); s.start(t); },
  play(n,a){
    if(!this.on()) return;
    if(n==='tap') this.tone(540,.1,{type:'triangle',to:860,vol:.09});
    else if(n==='gain'){ this.tone(880,.09,{vol:.07}); this.tone(1320,.12,{at:.08,vol:.07}); }
    else if(n==='write') this.noise(.32,{vol:.045,grain:true,freq:3000});
    else if(n==='scan') this.tone(260,.8,{to:520,vol:.035});
    else if(n==='reveal'){ const L={N:3,R:4,SR:5,SSR:6,UR:8}[a]||3, sc=[523,659,784,1047,1319,1568,2093,2637];
      for(let i=0;i<L;i++) this.tone(sc[i],.32,{type:'triangle',at:i*.07,vol:.07}); if(L>=6) this.noise(.5,{at:L*.07,vol:.025,freq:6000}); }
    else if(n==='level'){ this.tone(180,.9,{type:'sawtooth',to:820,vol:.025}); this.noise(.25,{at:.95,vol:a==='explode'?.12:.05,lp:a==='explode'||a==='volcano',freq:a==='explode'?900:5000});
      [784,988,1175,1568].forEach((f,i)=>this.tone(f,.4,{type:'triangle',at:1+i*.06,vol:.06})); }
  }
};

let gaugeFrom=null;
function gainEnergy(n){
  if(n<=0) return 0;
  const before=levelInfo(S.totalEnergy);
  gaugeFrom=before;
  S.totalEnergy+=n; S.observationEnergy+=n;
  const after=levelInfo(S.totalEnergy);
  return after.lv>before.lv?after.lv:0;
}

function drawGauge(frac){
  const p=$('#gFill'),d=$('#gDot'); if(!p) return;
  const len=p.getTotalLength(), l=Math.max(0,Math.min(1,frac))*len, pt=p.getPointAtLength(l);
  p.style.strokeDasharray=`${Math.max(l,0.01)} ${len}`; d.setAttribute('cx',pt.x); d.setAttribute('cy',pt.y);
}
function animateGauge(){
  const to=levelInfo(S.totalEnergy); let from=gaugeFrom; gaugeFrom=null;
  if(!from||reduceMotion()){ drawGauge(to.frac); return; }
  const f0=from.lv<to.lv?0:from.frac, t0=performance.now();
  (function step(t){ const k=Math.min(1,(t-t0)/800), e=1-Math.pow(1-k,3); drawGauge(f0+(to.frac-f0)*e); if(k<1) requestAnimationFrame(step); })(t0);
}

/* ===== 下書きメモ（紙の研究ノートに写すための一時的なメモ）=====
   ・書けるのは研究中の画面だけ ・作成時刻は自動で記録され、変えられない
   ・書き直しは元の文を取り消し線で残す ・「写した」メモは7日後に自動で消える
   ・端末の中だけに保存（クラウド同期・テスト結果には含めない） */
const COPIED_KEEP_DAYS=7;
const FINE=matchMedia('(hover:hover) and (pointer:fine)').matches;
const MDB={db:null,name:TEST_BUILD?'kfw-chemtest-memos':'kfw-memos',
  open(){ if(this.db) return Promise.resolve(this.db);
    return new Promise((res,rej)=>{ let r; try{ r=indexedDB.open(this.name,1); }catch(e){ rej(e); return; }
      r.onupgradeneeded=()=>{ const st=r.result.createObjectStore('memos',{keyPath:'id'}); st.createIndex('session','sessionId'); };
      r.onsuccess=()=>{ this.db=r.result; res(this.db); }; r.onerror=()=>rej(r.error); }); },
  req(mode,fn){ return this.open().then(d=>new Promise((res,rej)=>{ const t=d.transaction('memos',mode), q=fn(t.objectStore('memos')); t.oncomplete=()=>res(q&&q.result); t.onerror=()=>rej(t.error); })); },
  put(m){ return this.req('readwrite',s=>s.put(m)).then(()=>m); },
  del(id){ return this.req('readwrite',s=>s.delete(id)); },
  all(){ return this.req('readonly',s=>s.getAll()).then(a=>(a||[]).sort((x,y)=>x.createdAt-y.createdAt)); },
  bySession(sid){ return this.all().then(a=>a.filter(m=>m.sessionId===sid)); },
  clear(){ return this.req('readwrite',s=>s.clear()); }
};
const WD='日月火水木金土';
function fmtDate(t){ const d=new Date(t); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`; }
function fmtTime(t){ const d=new Date(t), z=n=>String(n).padStart(2,'0'); return `${z(d.getHours())}:${z(d.getMinutes())}`; }
function memoErr(){ toast('メモを保存できませんでした。紙のノートに直接書いてください。',2600); }
async function cleanupMemos(){
  try{ const lim=Date.now()-COPIED_KEEP_DAYS*86400000; for(const m of await MDB.all()) if(m.copiedAt&&m.copiedAt<lim) await MDB.del(m.id); }catch(e){}
}
async function markCopied(sid){
  try{ for(const m of await MDB.bySession(sid)) if(!m.copiedAt){ m.copiedAt=Date.now(); await MDB.put(m); } }catch(e){}
}
/* 写真は長辺1280pxのJPEGに縮めて保存 */
function shrinkPhoto(file){
  return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onerror=()=>rej(fr.error); fr.onload=()=>{ const im=new Image(); im.onerror=rej; im.onload=()=>{
    const k=Math.min(1,1280/Math.max(im.width,im.height)), c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',0.78)); }; im.src=fr.result; }; fr.readAsDataURL(file); });
}
/* 1件の表示：元の文は取り消し線で残し、最新の文に修正時刻を付ける */
function memoItemHTML(m,editable){
  const revs=m.revs||[], last=revs[revs.length-1];
  const old=revs.slice(0,-1).map(r=>`<div class="mold">${esc(r.text)||'（説明なし）'}</div>`).join('');
  const cur=last&&last.text?`<div class="mtext">${esc(last.text)}${revs.length>1?` <span class="medit-at">（${fmtTime(last.at)} 修正）</span>`:''}</div>`:'';
  const photo=m.kind==='photo'?(m.photo?`<img class="mphoto" src="${m.photo}" alt="${fmtTime(m.createdAt)}の写真">`:`<div class="mold">写真を削除しました（${fmtTime(m.photoRemovedAt)}）</div>`):'';
  const acts=editable&&!m.voidedAt?`<div class="mact"><button data-medit="${m.id}">${m.kind==='photo'?(last&&last.text?'説明を書き直す':'説明を書く'):'書き直す'}</button>${m.kind==='photo'&&m.photo?`<button data-mdelphoto="${m.id}">写真を消す</button>`:''}<button data-mvoid="${m.id}">取り消す</button></div>`:'';
  return `<div class="mitem${m.voidedAt?' mvoid':''}" id="mi-${m.id}"><span class="mtime">${fmtTime(m.createdAt)}</span><div>${photo}${old}${cur}${m.voidedAt?`<div class="medit-at">取り消し（${fmtTime(m.voidedAt)}）</div>`:''}${m.copiedAt?'<div class="medit-at">紙に写した</div>':''}${acts}</div></div>`;
}
function bindMemoActions(box,refresh){
  box.querySelectorAll('[data-medit]').forEach(b=>b.onclick=async()=>{
    const all=await MDB.all(), m=all.find(x=>x.id===b.dataset.medit); if(!m) return;
    const last=(m.revs||[]).slice(-1)[0], el=box.querySelector('#mi-'+m.id+' > div');
    el.insertAdjacentHTML('beforeend',`<div class="mcompose" style="margin-top:6px"><textarea maxlength="400" aria-label="書き直す">${esc(last?last.text:'')}</textarea><div class="mrow"><button class="btn btn-small" data-ok>残す</button><button class="btn btn-small" data-cancel>やめる</button></div></div>`);
    const ta=el.querySelector('textarea'); ta.focus();
    el.querySelector('[data-cancel]').onclick=()=>refresh();
    el.querySelector('[data-ok]').onclick=async()=>{ const t=ta.value.trim(); if(last&&t===last.text){ refresh(); return; }
      m.revs=[...(m.revs||[]),{text:t,at:Date.now()}]; try{ await MDB.put(m); bump('memoEdits'); save(); }catch(e){ memoErr(); } refresh(); };
  });
  box.querySelectorAll('[data-mvoid]').forEach(b=>b.onclick=async()=>{
    if(!confirm('このメモを取り消し線で消しますか？（記録は残ります）')) return;
    const m=(await MDB.all()).find(x=>x.id===b.dataset.mvoid); if(!m) return; m.voidedAt=Date.now(); try{ await MDB.put(m); }catch(e){ memoErr(); } refresh(); });
  box.querySelectorAll('[data-mdelphoto]').forEach(b=>b.onclick=async()=>{
    if(!confirm('この写真を消しますか？　消したことは時刻とともに記録されます。')) return;
    const m=(await MDB.all()).find(x=>x.id===b.dataset.mdelphoto); if(!m) return; m.photo=null; m.photoRemovedAt=Date.now(); try{ await MDB.put(m); }catch(e){ memoErr(); } refresh(); });
}

/* 時刻付きのメモと写真を1枚の画像にまとめる */
function loadImg(src){ return new Promise(r=>{ const i=new Image(); i.onload=()=>r(i); i.onerror=()=>r(null); i.src=src; }); }
async function memoSheetImage(memos,title){
  try{ await document.fonts.ready; }catch(e){}
  const W=1080, P=64, TX=P+120, TW=W-TX-P, ink='#1E2A47', pen='#5C6380', red='#D6402E';
  const F=(w,s,hand)=>`${w} ${s}px ${hand?'"Yomogi","Klee One"':'"Klee One"'},"Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif`;
  const c=document.createElement('canvas'), x=c.getContext('2d');
  const wrap=(t,font)=>{ x.font=font; const out=[]; for(const para of String(t).split('\n')){ let line=''; for(const ch of para){ if(x.measureText(line+ch).width>TW&&line){ out.push(line); line=ch; } else line+=ch; } out.push(line); } return out; };

    b.h=Math.max(52,(b.ih?b.ih+20:0)+b.lines.length*50)+36; blocks.push(b); }
  const H=Math.min(15000,P+150+blocks.reduce((a,b)=>a+b.h,0)+110);
  c.width=W; c.height=H; x.fillStyle='#FCFCF9'; x.fillRect(0,0,W,H);
  x.strokeStyle='rgba(64,112,196,.12)'; x.lineWidth=1; for(let i=0;i<W;i+=24){ x.beginPath(); x.moveTo(i,0); x.lineTo(i,H); x.stroke(); } for(let i=0;i<H;i+=24){ x.beginPath(); x.moveTo(0,i); x.lineTo(W,i); x.stroke(); }
  x.strokeStyle='rgba(214,64,46,.35)'; x.lineWidth=3; x.beginPath(); x.moveTo(P+96,0); x.lineTo(P+96,H); x.stroke();
  x.fillStyle=ink; x.font=F(400,52,true); x.fillText(title,P,P+56);
  x.fillStyle=pen; x.font=F(600,24); x.fillText('下書きメモ（正式な記録は紙の研究ノートへ）',P,P+100);
  let y=P+160;
  for(const b of blocks){ if(y+40>H-100) break;
    x.fillStyle=red; x.font=F(600,30); x.fillText(fmtTime(b.m.createdAt),P,y+30);
    let yy=y;
    if(b.img){ x.save(); x.translate(TX,yy); x.rotate(-0.006); x.drawImage(b.img,0,0,b.iw,b.ih); x.strokeStyle=ink; x.lineWidth=3; x.strokeRect(0,0,b.iw,b.ih); x.restore(); yy+=b.ih+20; }
    for(const L of b.lines){ x.font=L.font; x.fillStyle=L.old||L.note||b.m.voidedAt?pen:ink; x.fillText(L.l,TX,yy+36);
      if(L.old||(b.m.voidedAt&&!L.note)){ const w=x.measureText(L.l).width; x.strokeStyle=pen; x.lineWidth=2.5; x.beginPath(); x.moveTo(TX,yy+24); x.lineTo(TX+w,yy+24); x.stroke(); }
      yy+=50; }
    y+=b.h; x.setLineDash([8,8]); x.strokeStyle='rgba(30,42,71,.25)'; x.lineWidth=2; x.beginPath(); x.moveTo(P,y-16); x.lineTo(W-P,y-16); x.stroke(); x.setLineDash([]);

}

function commitSession(wrote){
  if(wrote&&S.ending) markCopied(S.ending.sessionId);
  rollDaily();
  const e=S.ending, dur=Math.min(MAX_SESSION_SEC,Math.round((e.endTime-e.startTime)/1000));
  let gain=0;
  if(dur>=MIN_COUNT_SEC){
    S.researchSessionCount++;
    S.sessions.push({sessionId:e.sessionId,startTime:e.startTime,endTime:e.endTime,duration:dur,proc:e.proc});
    if(S.sessions.length>300) S.sessions=S.sessions.slice(-300);
    S.lastResearchDate=today();
    const pr=e.proc||S.procStage; S.footprints[pr]=(S.footprints[pr]||0)+1;   // 足あとは自動で残る（入力なし・報酬なし）
  }
  const q=dur>=MIN_REWARD_SEC;
  if(q&&S.daily.sessionRewards<DAILY_REWARD_CAP){ S.daily.sessionRewards++; gain+=2; }
  if(wrote){ SFX.play('write'); S.notebookConfirmationCount++; if(q&&S.daily.noteRewards<DAILY_REWARD_CAP){ S.daily.noteRewards++; gain++; } }
  const lvUp=gainEnergy(gain); if(lvUp) bump('levelUps');
  S.ending=null; save();
  if(gain) setTimeout(()=>SFX.play('gain'),300);
  const msg=gain?`エネルギー +${gain}`:(wrote?'痕跡を残せました':'戻ってこられたのが一歩です');
  if(lvUp) pendingFx=()=>reactionFx(lvUp,()=>toast(msg)); else setTimeout(()=>toast(msg),80);
  go('home');
}

/* ----- ⑤ 反応演出：ノートに反応のようすが描かれていく（約3秒・タップで閉じる） ----- */
function burstLines(cx,cy,n,color,r1,r2,delay,w){
  let h=''; for(let i=0;i<n;i++){ const a=i/n*Math.PI*2+rand()*.25, ra=r1*(.8+rand()*.4), rb=r2*(.75+rand()*.4);
    h+=`<path class="drawin" pathLength="1" d="M${(cx+Math.cos(a)*ra).toFixed(1)} ${(cy+Math.sin(a)*ra).toFixed(1)} L${(cx+Math.cos(a)*rb).toFixed(1)} ${(cy+Math.sin(a)*rb).toFixed(1)}" stroke="${Array.isArray(color)?color[i%color.length]:color}" stroke-width="${w||3.2}" stroke-linecap="round" fill="none" style="animation-delay:${(delay+i*0.012).toFixed(2)}s"/>`; }
  return h;
}
function fxDoodle(R){
  const c=R.color;
  if(R.type==='flame') return burstLines(110,90,16,c,10,62,0)+burstLines(250,72,14,c,8,52,.28)+burstLines(182,135,12,c,6,42,.5)
    +`<g fill="${c}" opacity=".85">${[[70,40],[290,120],[140,160],[230,20],[320,60]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.5"/>`).join('')}</g>`;
  if(R.type==='explode'){ let pts=''; for(let i=0;i<24;i++){ const a=i/24*Math.PI*2, r=i%2?34:70; pts+=`${(180+Math.cos(a)*r).toFixed(1)},${(95+Math.sin(a)*r*0.8).toFixed(1)} `; }
    return `<polygon points="${pts}" fill="${c}" filter="url(#pencil)"/><polygon class="drawin" pathLength="1" points="${pts}" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>`
      +burstLines(180,95,14,'var(--ink)',84,112,.15,2.2)+`<text x="180" y="106" text-anchor="middle" font-size="30" font-family="Yomogi, cursive" fill="var(--ink)">ポン！</text>`; }
  return `<g transform="translate(18 -16) scale(.9)"><path d="M60 190 L150 104 Q181 92 212 104 L300 190Z" fill="#B88C7A" filter="url(#pencil)"/>`
    +`<path class="drawin" pathLength="1" d="M60 190 L150 104 Q181 92 212 104 L300 190" fill="none" stroke="var(--ink)" stroke-width="2.6" stroke-linejoin="round"/>`
    +`<path class="drawin" pathLength="1" d="M168 102 C150 70 196 66 176 40 C160 20 200 14 186 -6" fill="none" stroke="${c}" stroke-width="12" stroke-linecap="round" style="animation-delay:.2s"/>`
    +burstLines(182,20,10,['#FFB23F',c],14,70,.35,4)+'</g>';
}
function reactionFx(lv,after){
  const R=reactionFor(lv);
  SFX.play('level',R.type); hap([20,60,30]);
  const ov=document.createElement('div'); ov.className='react-ov'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-label',`反応Lv ${lv}。${R.label}`);
  ov.innerHTML=`<div class="rpage paper"><svg viewBox="0 0 360 290" aria-hidden="true">
      <g id="fx"></g>
      <g transform="translate(24 196)">
        <path class="drawin" pathLength="1" d="${FULL}" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" filter="url(#wob1)" style="animation-duration:.7s"/>
        <path id="fxPath" d="${FULL}" fill="none" stroke="none"/>
        <g font-size="12" fill="var(--pencil)" font-family="Klee One, sans-serif"><text x="8" y="80">反応物</text><text x="170" y="2" text-anchor="middle">活性化エネルギー</text><text x="304" y="84" text-anchor="end">生成物</text></g>
        <circle id="fxBall" r="8" cx="8" cy="58" fill="${R.color}" stroke="var(--ink)" stroke-width="2"/>
      </g></svg>
    <p class="big"><span class="hl">反応Lv ${lv}</span></p><p class="small">${R.label}</p>
    <p class="small2">反応図鑑と、机の上に記録が増えました</p><span class="skip">タップで閉じる</span></div>`;
  document.body.appendChild(ov);
  const path=ov.querySelector('#fxPath'), ball=ov.querySelector('#fxBall'), fx=ov.querySelector('#fx');
  const len=path.getTotalLength();
  const tmp=document.createElementNS(SVGNS,'path'); tmp.setAttribute('d',CLIMB); ov.querySelector('svg').appendChild(tmp); const climbLen=tmp.getTotalLength(); tmp.remove();
  const place=l=>{ const p=path.getPointAtLength(l); ball.setAttribute('cx',p.x); ball.setAttribute('cy',p.y); };
  const fire=()=>{ if(!fx.innerHTML) fx.innerHTML=fxDoodle(R); };
  let done=false; const close=()=>{ if(done) return; done=true; ov.remove(); after&&after(); };
  ov.onclick=close;
  if(reduceMotion()){ place(len); fire(); setTimeout(close,3000); return; }
  const t0=performance.now()+350;
  (function step(t){ if(done) return; const k=(t-t0)/1000;
    if(k<0){ place(0); }
    else if(k<0.85){ const e=k/0.85; place(climbLen*(e*e*(3-2*e))); }
    else if(k<1.2){ fire(); place(climbLen+(len-climbLen)*((k-0.85)/0.35)); }
    else { place(len); return; }
    requestAnimationFrame(step); })(performance.now());
  setTimeout(close,4200);
}

function exportData(){

  const mins=S.sessions.reduce((a,x)=>a+x.duration,0)/60, L=levelInfo(S.totalEnergy);
  return {code:S.testCode, ver:'chem-alpha-3d-1', from:S.metrics.firstUse, at:today(),
    usedDays:S.metrics.firstUse?dayNum(today())-dayNum(S.metrics.firstUse)+1:0, loginDays:S.loginDays,
    sessions:S.researchSessionCount, activeDays:days.length, gapReturns, totalMin:Math.round(mins),
    medianMin:(()=>{ const a=S.sessions.map(x=>x.duration/60).sort((p,q)=>p-q); return a.length?Math.round(a[Math.floor(a.length/2)]):0; })(),
    notebook:S.notebookConfirmationCount, later:S.metrics.later, level:L.lv, energy:S.totalEnergy,
    observations:S.observationCount, found:S.ownedCharacterIds.length, stage:S.profile&&S.profile.stage,
    proc:S.procStage, footprints:S.footprints, swaps:S.metrics.swaps, mapPicks:S.metrics.mapPicks, hereSets:S.metrics.hereSets,
    taps:S.metrics.taps, tools:S.metrics.tools||{}, memoText:S.metrics.memoText||0, memoPhoto:S.metrics.memoPhoto||0, memoEdits:S.metrics.memoEdits||0, memoExports:S.metrics.memoExports||0, qRounds:S.metrics.qRounds||0, qCorrect:S.metrics.qCorrect||0, stemTaps:S.metrics.stemTaps||0, resumes:S.metrics.resumes, recovers:S.metrics.recovers, levelUps:S.metrics.levelUps,
    log:S.sessions.map(x=>[today(new Date(x.startTime)),Math.round(x.duration/60),x.proc||''])};
}

function myCard(){ return {author:UID,nick:S.profile.displayName,stage:S.profile.stage,charId:S.selectedCharacterId,createdAt:Date.now()}; }
async function submitPost(){
  const text=draft.trim();
  if(!text){ toast('ひとこと書いてから投稿してください',1200); return; }
  if(Date.now()-lastPostAt<POST_INTERVAL_MS){ toast('少し時間をおいてから投稿してください',1500); return; }
  const btn=$('#psend'); btn.disabled=true;
  try{
    await DB.collection('posts').doc().set({...myCard(),interests:S.profile.interests||[],cat:postCat,text:text.slice(0,POST_MAX),reactions:{},replies:{}});
    lastPostAt=Date.now(); draft=''; toast('投稿しました',800); renderPlaza();
  }catch(e){ btn.disabled=false; handleWriteErr(e); }
}
async function react(pid,type,btn){
  if(pendingDoc.has(pid)) return;
  const p=posts.find(x=>x.id===pid); if(!p) return;
  const on=!((p.reactions||{})[UID]||{})[type];
  // ③ 即時フィードバック：先に画面を変える
  btn.setAttribute('aria-pressed',on); btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
  const c=countR(p,type)+(on?1:-1); btn.textContent=`${RTYPES.find(t=>t.id===type).label} ${c||''}`;
  pendingDoc.add(pid);
  try{ await DB.doc('posts/'+pid).update({reactions:{[UID]:{[type]:on}}}); }
  catch(e){ handleWriteErr(e); renderFeed(); }
  finally{ pendingDoc.delete(pid); }
}

function handleWriteErr(e){
  const c=e&&e.code;
  if(c==='invalid_argument'){ canWrite=false; toast('この画面では書き込めません（閲覧のみ）',2000); if(view==='plaza') renderPlaza(); }
  else if(c==='quota_exceeded') toast('広場の保存容量がいっぱいです。管理者に連絡してください。',2600);
  else if(c==='resource_exhausted') toast('少し時間をおいてから試してください',1600);
  else toast('送信できませんでした。通信を確かめてもう一度どうぞ。',2000);
}

async function doSync(){
  if(syncing){ syncAgain=true; return; } syncing=true;
  try{ await DB.doc('data/users/'+UID+'/state').set({json:JSON.stringify(S),updatedAt:S.updatedAt||Date.now()}); }catch(e){}
  syncing=false; if(syncAgain){ syncAgain=false; doSync(); }
}
async function pullRemote(){
  try{
    const d=await DB.doc('data/users/'+UID+'/state').get();
    if(d.exists){ const r=d.data();
      if((r.updatedAt||0)>(S.updatedAt||0)&&!S.running&&!S.ending){ S=Object.assign(fresh(),JSON.parse(r.json)); try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} render(); toast('ほかの端末の記録を読み込みました',1500); }
      else if((S.updatedAt||0)>(r.updatedAt||0)) scheduleSync();
    } else scheduleSync();
  }catch(e){}
}
async function initCloud(){
  let tries=0; while(!(window.claude&&window.claude.use)&&tries<20){ await new Promise(r=>setTimeout(r,250)); tries++; }
  if(window.claude&&window.claude.use){
    try{ USER=await window.claude.use('user'); }catch(e){ USER=null; }
    try{ DB=await window.claude.use('db'); }catch(e){ DB=null; }
    if(USER){ try{ UID=await USER.id(); }catch(e){} try{ canWrite=await USER.can('data.write'); }catch(e){} }
    if(DB){
      unsubPosts=DB.collection('posts').orderBy('createdAt','desc').limit(80).onSnapshot(snap=>{
        posts=snap.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()}));
        if(view==='plaza') renderFeed();
      },()=>{ DB=null; if(view==='plaza') renderPlaza(); });
      if(UID) pullRemote();
    }
  }
  cloudReady=true;
  if(view==='plaza') renderPlaza();
}

/* ----- 観測 ----- */
function drawChar(){
  const boost=Math.min(PITY_MAX,1+PITY_STEP*(S.dupStreak||0));
  const w=CHARS.map(c=>c.p*(!S.ownedCharacterIds.includes(c.id)&&c.r!=='UR'?boost:1));
  let r=rand()*w.reduce((a,b)=>a+b,0),acc=0;
  for(let i=0;i<CHARS.length;i++){ acc+=w[i]; if(r<acc) return CHARS[i]; }
  return CHARS[0];
}
function obsControls(){
  const e=S.observationEnergy,can=e>=OBS_COST;
  return `<button class="btn btn-primary" id="obsBtn" ${can?'':'disabled'}>未確認研究生命体を観測する</button>
    <p class="sub">${can?`観測エネルギー ${e}（1回 ${OBS_COST}）`:`あと${OBS_COST-e}エネルギー`}</p>${can?'':'<p class="sub">研究に戻ると、エネルギーがたまります。</p>'}`;
}
function haloSVG(r){
  const n={N:10,R:14,SR:18,SSR:22,UR:30}[r]||10;
  const col=r==='UR'?['#FF6FB5','#5FB8FF','#6FE0B0','#FFD24A','#B48CF0']:getComputedStyle(document.documentElement).getPropertyValue('--r-'+r).trim()||'#888';
  return `<svg viewBox="0 0 200 200" aria-hidden="true">${burstLines(100,100,n,col,62,92,0,r==='N'?2.4:3.4)}${r==='SSR'||r==='UR'?burstLines(100,100,n,col,40,52,.25,2):''}</svg>`;
}
function renderObserve(){
  setChrome(true);
  main.innerHTML=`<section class="screen narrow"><h2 class="ttl">観測ノート</h2>
    <div class="obs-page paper tape"><div class="lens" id="lens" data-phase="idle">
      <svg class="cross" viewBox="0 0 100 100" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M50 4v14M50 82v14M4 50h14M82 50h14"/><circle cx="50" cy="50" r="2" fill="currentColor"/></svg>
      <div class="creature" id="creature"></div>
      <p class="idle-msg" id="idleMsg">レンズの先に、<br>まだ描かれていない<br>生命体がいます。</p></div></div>
    <div class="obs-panel" id="panel">${obsControls()}</div>
    <details class="rates"><summary>観測率を見る</summary><table>${CHARS.map(c=>`<tr><td><span class="badge" style="--rb:var(--r-${c.r})">${c.r}</span> ${S.ownedCharacterIds.includes(c.id)?esc(c.name):'？？？？？？'}</td><td>${c.p}%</td></tr>`).join('')}</table>
    <p class="count" style="font-size:13px;margin:0 0 12px">表示は基本の観測率です。観測済みの生命体が続くと、まだ見ていない生命体（URを除く）が少しずつ見つかりやすくなります。URはどれだけ観測しても確定しません。</p></details></section>`;
  const b=$('#obsBtn'); if(b) b.onclick=observe;
}
function observe(){
  if(busy||S.observationEnergy<OBS_COST) return; busy=true;
  const c=drawChar(), isNew=!S.ownedCharacterIds.includes(c.id), memoBefore=isNew?0:memoCount(c.id);
  S.observationEnergy-=OBS_COST; S.observationCount++;
  if(isNew) S.ownedCharacterIds.push(c.id);
  S.charObs[c.id]=(S.charObs[c.id]||0)+1; S.dupStreak=isNew?0:(S.dupStreak||0)+1; save();
  const memoAfter=memoCount(c.id), nextT=MEMO_T.find(t=>t>obsOf(c.id));
  const lens=$('#lens'), cr=$('#creature'), panel=$('#panel');
  $('#idleMsg').remove();
  cr.innerHTML=`<div class="halo"></div><div class="sk">${art(c.id,'sil')}</div><div class="paint">${art(c.id)}</div>`;
  panel.innerHTML=`<p class="sub" aria-live="polite">観測中…</p>`;
  SFX.play('scan');
  const T=reduceMotion()?[0,400,800,1100]:[0,900,1700,2350];
  lens.dataset.phase='scan';
  setTimeout(()=>lens.dataset.phase='sil',T[1]);
  setTimeout(()=>{ cr.querySelector('.halo').innerHTML=haloSVG(c.r); lens.dataset.phase='glow'; },T[2]);
  setTimeout(()=>{
    lens.dataset.phase='reveal'; SFX.play('reveal',c.r); hap(c.r==='N'||c.r==='R'?15:[15,40,15,40,30]);
    startBoil(cr.querySelector('.paint svg'));
    const msg=isNew?'新しい生命体を観測しました。図鑑に記録しました。'
      :(memoAfter>memoBefore?`観測ログ ${S.charObs[c.id]}回目。生態メモが1行ふえました。`:`観測ログ ${S.charObs[c.id]}回目。${nextT?`あと${nextT-obsOf(c.id)}回で、次の生態メモ。`:'生態メモはすべてそろっています。'}`);
    panel.innerHTML=`<span class="badge" style="--rb:var(--r-${c.r})">${c.r}</span>
      <p class="result-name"><span class="hl">${esc(c.name)}</span></p>
      <p class="sub" aria-live="polite">${msg}</p>
      ${memoAfter>memoBefore||isNew?`<p class="sub" style="font-family:var(--hand);font-size:17px;color:var(--ink)">「${esc(MEMO[c.id][memoAfter-1])}」</p>`:''}
      ${isNew&&S.selectedCharacterId!==c.id?`<button class="btn btn-soft" id="toHome">ホームに連れていく</button>`:''}
      <button class="btn btn-quiet" id="again">${S.observationEnergy>=OBS_COST?'もう一度観測する':(S.profile&&S.researchSessionCount===0?'今日の一歩へ':'観測を終える')}</button>`;
    const th=$('#toHome'); if(th) th.onclick=()=>{ S.selectedCharacterId=c.id; save(); go('home'); };
    $('#again').onclick=()=>{ busy=false; if(S.observationEnergy>=OBS_COST) renderObserve(); else go('home'); };
    busy=false; setChrome(true);
  },T[3]);
}

/* ----- 図鑑 ----- */
function renderZukan(){
  setChrome(true);
  const owned=S.ownedCharacterIds;
  main.innerHTML=`<section class="screen"><div><h2 class="ttl">生命体図鑑</h2><p class="count">${owned.length} / ${CHARS.length} 体を発見。同じ生命体を観測するたびに、生態メモが増えていきます。</p></div>
    <div class="grid">${CHARS.map(c=>owned.includes(c.id)
      ?`<button class="cell${S.selectedCharacterId===c.id?' current':''}" data-id="${c.id}">${art(c.id)}<span class="badge" style="--rb:var(--r-${c.r})">${c.r}</span><span class="nm">${esc(c.name)}</span><span class="meta">メモ ${memoCount(c.id)}/4</span></button>`
      :`<div class="cell unknown">${art(c.id,'sil')}<span class="nm">？？？？？？</span></div>`).join('')}</div>
    <p class="count" style="text-align:center">ホームに連れていった1体が、${TEST_BUILD?'あなたのノートの相棒です。':'広場でのあなたのアイコンになります。<br>図鑑そのものは、ほかの人には見えません。'}</p></section>`;
  main.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{ SFX.play('tap'); openSheet(b.dataset.id); });
}
function openSheet(id){
  const c=BYID[id], cur=S.selectedCharacterId===id, n=memoCount(id);
  const bg=document.createElement('div'); bg.className='sheet-bg';
  bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(c.name)}">
    ${art(id)}<span class="badge" style="--rb:var(--r-${c.r})">${c.r}</span><h3>${esc(c.name)}</h3>
    <p class="count">観測ログ ${obsOf(id)}回</p>
    <ul class="memo">${MEMO[id].map((m,i)=>i<n?`<li>${esc(m)}</li>`:`<li class="locked">？？？（観測${MEMO_T[i]}回目で解放）</li>`).join('')}</ul>
    ${cur?'<p class="count">いまホームにいます。</p>':'<button class="btn btn-primary" id="setH">ホームに連れていく</button>'}
    <button class="btn btn-quiet" id="cls">閉じる</button></div>`;
  document.body.appendChild(bg);
  startBoil(bg.querySelector('.sheet>svg'));
  const close=()=>bg.remove(); bg.onclick=e=>{ if(e.target===bg) close(); }; bg.querySelector('#cls').onclick=close;
  const s=bg.querySelector('#setH'); if(s) s.onclick=()=>{ S.selectedCharacterId=id; save(); close(); go('home'); };
}

/* ===== 起動 ===== */
if(TEST_BUILD){ const pb=document.querySelector('nav [data-tab="plaza"]'); if(pb) pb.remove(); document.querySelector('nav .in').style.gridTemplateColumns='repeat(4,1fr)'; }
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{ if(!busy) go(b.dataset.tab); });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&S.running&&view==='focus'){ const c=$('#clock'); if(c) c.textContent=fmt((Date.now()-S.running.startTime)/1000); } });

document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return;
  const ov=document.querySelector('.react-ov'); if(ov){ ov.click(); return; }
  const bgs=document.querySelectorAll('.sheet-bg'); if(bgs.length){ const bg=bgs[bgs.length-1]; bg.dispatchEvent(new MouseEvent('click',{bubbles:true})); } });
load(); rollDaily();
if(S.profile){
  if(S.running) view='recover';
  else if(S.lastLoginDate!==today()){
    S.lastLoginDate=today(); S.loginDays=(S.loginDays||0)+1;
    const special=S.loginDays%LOGIN_MILESTONE_EVERY===0;
    const lvUp=gainEnergy(special?LOGIN_MILESTONE:LOGIN_NORMAL); save();
    const t=()=>special?toast(`✦ ${S.loginDays}日目の記念 エネルギー +${LOGIN_MILESTONE}`,1300):toast('エネルギー +1',700);
    if(lvUp) pendingFx=()=>reactionFx(lvUp,t); else setTimeout(t,50);
  }
}
if(S.profile&&!S.testCode){ S.testCode=makeCode(); if(!S.metrics.firstUse) S.metrics.firstUse=today(); save(); }
render();
cleanupMemos();
if(!TEST_BUILD) initCloud(); else cloudReady=true;
if(TEST_BUILD&&'serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }
})();
</script>
